name: GENESIS v2 source integrity and CPU tests

on:
  push:
    branches:
      - research/fresh-curvature-revalidation-v1-20261102
    paths:
      - "implementation/genesis-v2/**"
      - "research/revalidation/**"
      - ".github/workflows/genesis-v2-cpu.yml"
  pull_request:
    paths:
      - "implementation/genesis-v2/**"
      - "research/revalidation/**"
      - ".github/workflows/genesis-v2-cpu.yml"

permissions:
  contents: read

jobs:
  source-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify shipped source bytes against 144-file SHA256 manifest
        working-directory: implementation/genesis-v2
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, sys
          root=pathlib.Path('.')
          m=json.loads((root/'DELIVERY_MANIFEST.json').read_text(encoding='utf-8'))
          files=m['files']
          assert len(files)==144, f'Unexpected manifest count {len(files)}'
          assert len({e['path'] for e in files})==len(files), 'Duplicate manifest path'
          for e in files:
              name=e['path']
              p=root/name
              if p.is_symlink() or not p.is_file():
                  raise SystemExit(f'Missing or symbolic source path: {name}')
              actual=p.read_bytes()
              if len(actual)!=int(e['bytes']) or hashlib.sha256(actual).hexdigest()!=e['sha256']:
                  raise SystemExit(f'Source integrity check failed: {name}')
          print('SOURCE_MANIFEST_VERIFIED',len(files))
          PY
  cpu-regression:
    runs-on: ubuntu-latest
    needs: source-integrity
    env:
      OPENBLAS_NUM_THREADS: "2"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    defaults:
      run:
        working-directory: implementation/genesis-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test-only CPU PyTorch, no GPU or paid API
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.10.0 torchvision==0.25.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[images,test]"
      - name: Compile code and test suite
        run: python -m compileall -q genesis_gpu tests_v2
      - name: Run v2 numerical/software tests
        run: python -m pytest -q tests_v2
      - name: Explicit evidence boundary
        run: |
          echo "CPU CI checks source integrity and engineering tests ONLY."
          echo "Native Windows RTX 4070 Ti CUDA G0 and S1/S2/S3 are NOT run by this workflow."
